name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chore/verify-chatgpt-write-access

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and component tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Run TypeScript check
        run: bunx tsc --noEmit

      - name: Build production application
        run: bun run build
