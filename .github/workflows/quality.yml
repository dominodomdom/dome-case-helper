name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chore/verify-chatgpt-write-access

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and component tests
        run: bun run test

      - name: Check formatting of files changed for D1
        run: bunx prettier --check src/components/dome/DomeWorkspace.tsx src/components/ui/badge.tsx src/components/ui/button.tsx src/components/ui/form.tsx src/components/ui/navigation-menu.tsx src/components/ui/sidebar.tsx src/components/ui/toggle.tsx src/lib/case-state.ts src/lib/case-state-v1-1.test.ts src/test/ai-independence-workspace.test.tsx src/test/case-state.test.ts

      - name: Run lint
        run: bun run lint

      - name: Run TypeScript check
        run: bunx tsc --noEmit

      - name: Build production application
        run: bun run build
